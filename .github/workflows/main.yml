name: A workflow for my Hello World App

on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Package with Maven
        run: mvn package

      - name: Create Docker Network
        run: docker network create sem-network

      - name: Start MySQL Container
        run: |
          docker run --name sem-mysql --network sem-network \
            -e MYSQL_ROOT_PASSWORD=CiRootPass123 \
            -e MYSQL_DATABASE=semdb \
            -e MYSQL_USER=semuser \
            -e MYSQL_PASSWORD=CiDbPass123 \
            -d mysql:8.4

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if docker exec sem-mysql mysqladmin ping -h localhost -u root -pCiRootPass123 --silent; then
              exit 0
            fi
            sleep 2
          done
          docker logs sem-mysql
          exit 1

      - name: Build Docker Image
        run: docker build -t semimage .

      - name: Test Application Database Connection
        run: |
          docker run --rm --name sem-app --network sem-network \
            -e DB_HOST=sem-mysql \
            -e DB_NAME=semdb \
            -e DB_USER=semuser \
            -e DB_PASSWORD=CiDbPass123 \
            semimage